[package]
name = "gui-dgt-sim"
version = "0.1.0"
edition = "2024"
description = "Native egui GUI for dgt-sim: one tab per virtual DGT chess board"
license = "MIT OR Apache-2.0"
repository = "https://github.com/luisfer-cli/gui-dgt-sim"
rust-version = "1.88"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
